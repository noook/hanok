# Tailscale exit node and subnet router (hanok: hosts/family-dxp/tailscale).
# accept_ra=2 keeps the NAS's IPv6 address from the box once forwarding is on.
# Installed as /etc/sysctl.d/99-tailscale.conf (after UGOS's 90-ugos_network.conf and 99-sysctl.conf), then
# `sudo sysctl -p /etc/sysctl.d/99-tailscale.conf`. Check again after a UGOS update.
net.ipv6.conf.eth0.accept_ra = 2
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
