# SOPS recipients: age public keys only (safe to commit). The maintainer's Mac and docker-host,
# the same keys as Plouf's secrets. After editing: sops updatekeys stacks/<stack>/secrets.enc.env
# SOPS matches path_regex against the INPUT file, so a rule on stacks/*/secrets.enc.env never matched
# `sops --encrypt /tmp/x.env > stacks/<stack>/secrets.enc.env`. Every dotenv file uses the same recipients.
creation_rules:
  - path_regex: \.env$
    key_groups:
      - age:
        - age1392prarwhkgv6szfz8nryr3x6pltqrfd4kr2cyczt0sp0saua4vsasj9da # macnook-pro
        - age13a09uaukqdjvft69xl3ankpt4lgdgv7fl2l69ttrsfz76gzunqhq7d78uz # docker-host
        - age1r95y653jpasthq8lqz99m356sr2tr6tdt0km8s6malnsf5ttnd3s0tghk0 # work
